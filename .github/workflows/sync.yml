name: Synkroniser hyttecal

on:
  schedule:
    # Kjører hver natt kl. 03:00 UTC (05:00 norsk sommertid / 04:00 normaltid)
    - cron: '0 3 * * *'
  workflow_dispatch: # Tillat manuell kjøring

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: corepack
        run: corepack enable

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Infer playwright version
        shell: bash
        run: |
          echo "PLAYWRIGHT_VERSION=$(pnpm list @playwright/test --json --depth=0 | jq -r '.[0].devDependencies.["@playwright/test"].version')" >> $GITHUB_ENV
      - name: Cache playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}
          path: ~/.cache/ms-playwright
      - name: Install Playwright browsers
        shell: bash
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install --with-deps chromium

      - name: Kjør skraper og generer kalender
        run: pnpm start

      - name: Commit og push oppdatert kalender
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hyttecal.ics
          if git diff --staged --quiet; then
            echo "Ingen endringer i kalenderen."
          else
            git commit -m "Oppdater hyttecal.ics [$(date -u '+%Y-%m-%d')]"
            git push
          fi
